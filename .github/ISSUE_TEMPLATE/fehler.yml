name: Fehler melden
description: Melde einen Fehler in Pedalsteuerung.
body:
  - type: input
    id: version
    attributes:
      label: App-Version und macOS-Version
      placeholder: "Pedalsteuerung 2.1.0, macOS 13"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Was ist passiert?
      description: Welche Schritte führen zum Fehler und was hättest du erwartet?
    validations:
      required: true
