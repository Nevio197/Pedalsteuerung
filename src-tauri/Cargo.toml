[package]
name = "pedalsteuerung"
version = "2.1.0"
description = "Philips USB pedal control for macOS"
edition = "2024"
default-run = "pedalsteuerung"

[lib]
name = "pedalsteuerung_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2.14"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["time"] }
tungstenite = "0.29"
ureq = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }

[profile.release]
lto = "thin"
strip = "symbols"
